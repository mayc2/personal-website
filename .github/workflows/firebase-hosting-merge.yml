name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [master]

permissions:
  contents: read
  checks: write

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lint, typecheck, test, build, e2e
        run: npx nx run-many -t lint typecheck test build e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHRISMAY_41DCD }}
          channelId: live
          projectId: chrismay-41dcd
